<!--
  ═══════════════════════════════════════════════════════════════════════════
  CALLEM — BIBLIOTHÈQUE D'ASSETS PARTAGÉE
  À copier INTÉGRALEMENT dans chaque proposition, juste après <body>.
  Contient : les tokens de marque + le sprite SVG (logo Callem, 22 logos
  partenaires, 18 icônes duotone propriétaires, 4 motifs de texture).
  ═══════════════════════════════════════════════════════════════════════════
  NOTE : les logos partenaires sont des reconstructions vectorielles destinées
  à la maquette. Ils seront remplacés par les fichiers officiels des marques
  avant mise en ligne.
-->

<style id="callem-brand">
/* ═══ CHARTE CALLEM ═══════════════════════════════════════════════════════ */
:root{
  /* — Marque — */
  --brand-indigo:#6772E5;      /* haut du dégradé du logo */
  --brand-violet:#9F32FC;      /* bas du dégradé du logo */
  --brand-500:#8B5CF6;         /* wordmark officiel */
  --brand-400:#A78BFA;
  --brand-300:#C4B5FD;
  --brand-600:#7C3AED;
  --brand-700:#6D28D9;
  --brand-glow:#A855F7;        /* primaire du dashboard — halos, états live */

  --grad-brand:linear-gradient(160deg,var(--brand-indigo) 0%,var(--brand-violet) 100%);
  --grad-brand-h:linear-gradient(90deg,var(--brand-indigo) 0%,var(--brand-violet) 100%);
  --grad-aurora:radial-gradient(60% 60% at 30% 20%,#6772E5 0%,transparent 70%),
                radial-gradient(50% 50% at 75% 45%,#9F32FC 0%,transparent 70%),
                radial-gradient(60% 60% at 50% 85%,#4F46E5 0%,transparent 70%);

  /* — Accents secondaires (dashboard Callem) — */
  --acc-orange:#EB6A0A;
  --acc-blue:#0A93DE;
  --acc-green:#3FCF8E;
  --acc-red:#F0546A;

  /* — Typographie — */
  --font-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;

  /* — Courbes — */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-both:cubic-bezier(.77,0,.175,1);
  --ease-soft:cubic-bezier(.32,.72,0,1);
}
/* Chargement des polices : à placer dans le <head>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
*/

/* ═══ CLASSES UTILITAIRES DE MARQUE ═══════════════════════════════════════ */
.c-logo{display:inline-flex;align-items:center;gap:.55rem}
.c-logo svg{display:block}
.c-mark{width:2rem;height:2rem;border-radius:.6rem}
.c-grad-text{background:var(--grad-brand-h);-webkit-background-clip:text;background-clip:text;color:transparent}
.c-glow{filter:drop-shadow(0 0 24px color-mix(in oklab,var(--brand-glow) 45%,transparent))}

/* Logos partenaires : gris au repos, couleur au survol (device Gladia/Retell) */
.plogo{height:1.5rem;width:auto;opacity:.55;filter:grayscale(1);
  transition:opacity .4s var(--ease-out),filter .4s var(--ease-out)}
.plogo:hover,.marquee:hover .plogo{opacity:1;filter:grayscale(0)}

/* Icône duotone : le trait prend currentColor, le remplissage prend l'accent */
.duo{width:1.5rem;height:1.5rem}
.duo .duo-fill{fill:var(--brand-500);opacity:.22}
.duo .duo-line{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
</style>
